name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install libopus (opus-ffi feature)
        run: sudo apt-get update && sudo apt-get install -y libopus-dev
      - name: Cache test vectors
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tests/vectors
          key: iamf-vectors-${{ hashFiles('tools/fetch_vectors.sh') }}
      - name: Fetch conformance vectors
        run: ./tools/fetch_vectors.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Check feature combinations
        run: |
          cargo check -p iamf-dec --no-default-features
          cargo check -p iamf-codecs --no-default-features
          cargo check -p iamf-codecs --features pcm,opus
      - name: Compile-check reference Chromium adapter
        run: |
          c++ -std=c++17 -fsyntax-only \
            -Iexamples/chromium -Icrates/iamf-capi/include \
            examples/chromium/iamf_rs_decoder_adapter.cc

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
      - name: cargo-deny (licenses, advisories, sources)
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: zizmor (workflow audit)
        run: |
          cargo install zizmor --locked
          zizmor .github/workflows/

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - name: Install libopus (opus-ffi feature)
        run: sudo apt-get update && sudo apt-get install -y libopus-dev
      - run: cargo install cargo-fuzz --locked
      - name: Cache test vectors
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tests/vectors
          key: iamf-vectors-${{ hashFiles('tools/fetch_vectors.sh') }}
      - name: Fetch corpus seeds
        run: |
          ./tools/fetch_vectors.sh
          mkdir -p fuzz/corpus/decode_stream
          cp tests/vectors/*.iamf fuzz/corpus/decode_stream/
      - name: Fuzz smoke (parser + stream decoder)
        run: |
          cargo fuzz run parse_obu -- -max_total_time=60
          cargo fuzz run decode_stream -- -max_total_time=120 -max_len=200000
