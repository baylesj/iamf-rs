[package]
name = "iamf-codecs"
description = "SubstreamDecoder implementations for the codecs IAMF carries (LPCM, Opus; FLAC and AAC-LC planned)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["pcm"]
pcm = []
opus = ["dep:opus-decoder"]
# TODO(milestone 6): flac = ["dep:claxon"], aac = ["dep:symphonia-codec-aac"]

[dependencies]
iamf-dec = { path = "../iamf-dec" }
iamf-obu = { path = "../iamf-obu" }
opus-decoder = { version = "0.1", optional = true }

[lints]
workspace = true
