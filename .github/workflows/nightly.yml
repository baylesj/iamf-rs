name: Nightly

# Longer checks than CI can afford on every push: extended fuzzing with
# debug assertions (overflow checks catch arithmetic bugs that release
# fuzzing misses) and the full conformance vector suite.

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [parse_obu, decode_stream, decode_batch, capi]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read the pinned fuzz toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' fuzz/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - name: Install libopus (opus-ffi feature)
        run: sudo apt-get update && sudo apt-get install -y libopus-dev
      - run: cargo install cargo-fuzz --locked
      - name: Cache test vectors
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tests/vectors
          key: iamf-vectors-${{ hashFiles('tools/fetch_vectors.sh') }}
      - name: Fetch corpus seeds
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ./tools/fetch_vectors.sh
          mkdir -p "fuzz/corpus/$TARGET"
          cp tests/vectors/*.iamf "fuzz/corpus/$TARGET/"
      - name: Fuzz with debug assertions (90 min)
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          max_len=200000
          if [ "$TARGET" = parse_obu ]; then max_len=4194304; fi
          cargo fuzz run --debug-assertions "$TARGET" -- \
            -max_total_time=5400 -max_len="$max_len" -rss_limit_mb=4096 -timeout=60
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  all-vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.97.1" # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install libopus and ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libopus-dev libasound2-dev
      - name: Fetch every conformance vector
        run: ./tools/fetch_vectors.sh --all
      - name: Test against the full vector set (debug, overflow checks on)
        run: cargo test --locked --workspace --all-features
      - name: Test against the full vector set (release)
        run: cargo test --locked --release --workspace --all-features
