[package]
name = "iamf-capi"
description = "C ABI for the iamf-rs streaming decoder, shaped after the iamf-tools decoder API Chromium consumes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["iamf", "audio", "capi", "ffi", "decoder"]
categories = ["multimedia::audio", "multimedia::encoding"]

[lib]
name = "iamf_rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Everything pure-Rust is on by default; embedders trim with
# default-features = false. Chromium-shaped minimal build:
#   --no-default-features --features pcm,opus-ffi
# (libopus from the embedder, no binaural stack, no symphonia codecs).
default = ["pcm", "opus", "flac", "aac", "binaural"]
pcm = ["iamf-codecs/pcm"]
opus = ["iamf-codecs/opus"]
opus-ffi = ["iamf-codecs/opus-ffi"]
flac = ["iamf-codecs/flac"]
aac = ["iamf-codecs/aac"]
binaural = ["iamf-dec/binaural"]

[dependencies]
iamf-dec = { path = "../iamf-dec", default-features = false }
iamf-codecs = { path = "../iamf-codecs", default-features = false }

# FFI requires unsafe; this crate intentionally does not inherit the
# workspace-wide forbid(unsafe_code).

# The workspace lint table forbids unsafe_code, which this FFI crate
# cannot inherit; the safety-adjacent lints are re-declared here.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
