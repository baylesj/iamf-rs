[package]
name = "iamfdec"
description = "CLI for inspecting and decoding/rendering standalone .iamf files to WAV"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
iamf-obu = { path = "../../crates/iamf-obu" }
iamf-dec = { path = "../../crates/iamf-dec" }
iamf-codecs = { path = "../../crates/iamf-codecs", features = ["pcm", "opus", "flac", "aac"] }

[features]
# Use libopus (FFI) instead of the pure-Rust Opus decoder.
opus-ffi = ["iamf-codecs/opus-ffi"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "decode"
harness = false

[lints]
workspace = true
