name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.97.1" # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install libopus (opus-ffi) and ALSA headers (iamfplay/cpal)
        run: sudo apt-get update && sudo apt-get install -y libopus-dev libasound2-dev
      - name: Cache test vectors
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tests/vectors
          key: iamf-vectors-${{ hashFiles('tools/fetch_vectors.sh') }}
      - name: Fetch conformance vectors
        run: ./tools/fetch_vectors.sh
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: Docs build (warnings are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features
      - name: Check feature combinations
        run: |
          cargo check -p iamf-dec --no-default-features
          cargo check -p iamf-codecs --no-default-features
          cargo check -p iamf-codecs --no-default-features --features pcm,opus
          cargo check -p iamfplay --no-default-features
          # The Chromium-shaped minimal build.
          cargo check -p iamf-capi --no-default-features --features pcm,opus-ffi
      - name: Workspace builds offline without ROAR
        # ROAR is a git dependency of the excluded crates/iamf-roar only.
        # If it ever enters the workspace graph again (even as an optional
        # dependency), offline builds without a cached ROAR checkout and
        # `cargo publish` break, so fail here.
        run: |
          if grep -q aom-roar Cargo.lock; then
            echo "error: aom-roar is in the workspace Cargo.lock" >&2
            exit 1
          fi
          cargo fetch --locked
          cargo build --offline --locked --workspace --all-features
          if cargo metadata --offline --locked --format-version 1 | grep -q aom-roar; then
            echo "error: aom-roar is in the workspace dependency graph" >&2
            exit 1
          fi
      - name: Build and run the reference Chromium adapter test
        run: |
          cargo build --locked --release -p iamf-capi
          c++ -std=c++17 -Wall -Werror \
            -Iexamples/chromium -Icrates/iamf-capi/include \
            examples/chromium/iamf_rs_decoder_adapter.cc \
            examples/chromium/iamf_rs_decoder_adapter_test.cc \
            target/release/libiamf_rs.a -lpthread -ldl -lm -o adapter_test
          ./adapter_test tests/vectors/test_000002.iamf

  msrv:
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins the dev toolchain; override it here.
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install libopus and ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libopus-dev libasound2-dev
      - name: Check with the minimum supported Rust version
        run: cargo check --locked --workspace --all-features --all-targets

  wasm:
    # docs/obr_binaural.wasm (the demo site's AudioWorklet renderer) is a
    # committed build of iamf-obr-wasm; check it still matches the source.
    # The build is reproducible with the pinned toolchain and these flags.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.97.1" # keep in sync with rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - name: Build the OBR AudioWorklet module
        run: |
          RUSTFLAGS="-C opt-level=s -C strip=symbols" \
            cargo build --locked -p iamf-obr-wasm --target wasm32-unknown-unknown --release
      - name: The committed docs/obr_binaural.wasm matches the source
        run: |
          if ! cmp target/wasm32-unknown-unknown/release/iamf_obr_wasm.wasm docs/obr_binaural.wasm; then
            echo "error: rebuild docs/obr_binaural.wasm (see crates/iamf-obr-wasm/README.md)" >&2
            exit 1
          fi

  roar:
    # crates/iamf-roar is outside the workspace (ROAR is a git dependency
    # and needs Rust >= 1.97.1, which rust-toolchain.toml pins).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.97.1" # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/iamf-roar
      - name: Install libopus (opus-ffi)
        run: sudo apt-get update && sudo apt-get install -y libopus-dev
      - name: Cache test vectors
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tests/vectors
          key: iamf-vectors-${{ hashFiles('tools/fetch_vectors.sh') }}
      - name: Fetch conformance vectors
        run: ./tools/fetch_vectors.sh
      - run: cargo fmt --manifest-path crates/iamf-roar/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/iamf-roar/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path crates/iamf-roar/Cargo.toml --locked --all-features
      - name: Docs build (warnings are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path crates/iamf-roar/Cargo.toml --locked --no-deps --all-features

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Official actions, pinned by commit. Each pins its tool's version:
      # cargo-deny-action v2.1.1 ships cargo-deny 0.20.2 (the official
      # release binary), and zizmor-action installs the zizmor wheel with
      # pip --require-hashes from its own locked hashes.
      - name: cargo-deny (licenses, advisories, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: zizmor (workflow audit)
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          inputs: .github/workflows/
          # Fail the job with findings in the log and as annotations,
          # rather than uploading SARIF to code scanning.
          advanced-security: false
          annotations: true

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read the pinned fuzz toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' fuzz/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - name: Install libopus (opus-ffi feature)
        run: sudo apt-get update && sudo apt-get install -y libopus-dev
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Cache test vectors
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tests/vectors
          key: iamf-vectors-${{ hashFiles('tools/fetch_vectors.sh') }}
      - name: Fetch corpus seeds
        run: |
          ./tools/fetch_vectors.sh
          for target in parse_obu decode_stream decode_batch capi; do
            mkdir -p "fuzz/corpus/$target"
            cp tests/vectors/*.iamf "fuzz/corpus/$target/"
          done
      - name: Fuzz smoke (parser, both decoders, C ABI)
        # fuzz/rust-toolchain.toml selects the pinned nightly here.
        working-directory: fuzz
        run: |
          cargo fuzz run parse_obu -- -max_total_time=60 -max_len=1048576
          cargo fuzz run decode_stream -- -max_total_time=120 -max_len=200000
          cargo fuzz run decode_batch -- -max_total_time=90 -max_len=200000
          cargo fuzz run capi -- -max_total_time=90 -max_len=200000
