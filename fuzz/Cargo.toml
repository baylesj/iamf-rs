[package]
name = "iamf-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
iamf-obu = { path = "../crates/iamf-obu" }
iamf-dec = { path = "../crates/iamf-dec" }
iamf-codecs = { path = "../crates/iamf-codecs", features = ["pcm", "opus-ffi", "flac", "aac"] }
iamf-capi = { path = "../crates/iamf-capi", features = ["opus-ffi"] }

[[bin]]
name = "parse_obu"
path = "fuzz_targets/parse_obu.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_stream"
path = "fuzz_targets/decode_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_batch"
path = "fuzz_targets/decode_batch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capi"
path = "fuzz_targets/capi.rs"
test = false
doc = false
bench = false
