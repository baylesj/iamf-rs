[package]
name = "iamf-opus-ffi"
description = "Minimal safe wrapper over an external libopus decoder (links the system or integrator-provided libopus; no bundled build)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["opus", "audio", "ffi", "decoder"]
categories = ["multimedia::audio", "external-ffi-bindings"]
links = "opus"

[build-dependencies]
pkg-config = "0.3"

# FFI requires unsafe; this crate intentionally does not inherit the
# workspace-wide forbid(unsafe_code).

# The workspace lint table forbids unsafe_code, which this FFI crate
# cannot inherit; the safety-adjacent lints are re-declared here.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
