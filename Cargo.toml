[workspace]
resolver = "2"
members = [
    "crates/iamf-obu",
    "crates/iamf-dec",
    "crates/iamf-codecs",
    "crates/iamf-capi",
    "crates/opus-ffi",
    "tools/iamfdec",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "BSD-3-Clause-Clear"
repository = "https://github.com/baylesj/iamf-rs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
