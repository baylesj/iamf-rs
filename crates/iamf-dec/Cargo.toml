[package]
name = "iamf-dec"
description = "IAMF decoding pipeline: substream decode, element reconstruction, rendering, mixing, post-processing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["iamf", "audio", "spatial-audio", "decoder", "eclipsa"]
categories = ["multimedia::audio", "multimedia::encoding"]

[features]
default = ["binaural"]
# obr-style SH-domain binaural rendering (embeds ~1.8 MB of SH-HRIR
# filter assets extracted from google/obr).
binaural = []

[dependencies]
iamf-obu = { path = "../iamf-obu" }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
