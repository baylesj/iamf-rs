[workspace]
resolver = "2"
members = [
    "crates/iamf-obu",
    "crates/iamf-dec",
    "crates/iamf-codecs",
    "crates/iamf-capi",
    "crates/opus-ffi",
    "tools/iamfdec",
    "tools/iamfplay",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause-Clear"
repository = "https://github.com/baylesj/iamf-rs"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
# Pedantic on, minus the noisy style/cast lints (casts in the DSP code
# are deliberate; docs for errors/panics are tracked separately).
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
# Exact f32 comparisons in the DSP code are deliberate: sentinel values
# (-1.0 timers, 1.0 pass-through gains) and bit-exactness tests.
float_cmp = "allow"
