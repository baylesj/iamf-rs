# cargo-deny configuration: license and advisory audit of the dependency
# tree, run in CI. https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[licenses]
allow = [
    "BSD-3-Clause-Clear", # this project
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",            # symphonia codecs
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"
ignore = [
    # `paste` is an unmaintained build-time proc macro pulled in by
    # ratatui, used only by the unpublished tools/iamfplay demo binary —
    # it is not part of the decoder library dependency tree. Drop this
    # ignore when ratatui migrates off it.
    "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
