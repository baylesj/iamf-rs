[package]
name = "iamf-dec"
description = "IAMF decoding pipeline: substream decode, element reconstruction, rendering, mixing, post-processing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["iamf", "audio", "spatial-audio", "decoder", "eclipsa"]
categories = ["multimedia::audio", "multimedia::encoding"]

[features]
default = ["binaural"]
# obr-style SH-domain binaural rendering (embeds ~1.8 MB of SH-HRIR
# filter assets extracted from google/obr).
binaural = ["dep:realfft"]
# Optional renderer backend: ROAR, the Rust port of AOM's Open Audio
# Renderer (OAR) — the rendering algorithm IAMF v2 references. Off by
# default: ROAR requires Rust 1.97.1 (above this workspace's 1.85 MSRV),
# is not on crates.io (git dependency pinned to a commit), and ships under
# BSD-3-Clause plus the AOM patent license. Select it at runtime with
# `StreamSettings::renderer = RendererBackend::Roar`.
roar = ["dep:aom-roar"]

[dependencies]
iamf-obu = { path = "../iamf-obu" }
realfft = { version = "3", optional = true }
aom-roar = { git = "https://github.com/AOMediaCodec/roar", rev = "45ca4926b7965c77576a8a911fa66cac84f4daea", optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
