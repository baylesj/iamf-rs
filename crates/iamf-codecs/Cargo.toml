[package]
name = "iamf-codecs"
description = "SubstreamDecoder implementations for the codecs IAMF carries (LPCM, Opus, FLAC, AAC-LC)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Everything pure-Rust is on by default (symphonia-style); embedders trim
# with default-features = false and an explicit list. `opus-ffi` stays
# opt-in because it links an external libopus.
default = ["pcm", "opus", "flac", "aac"]
pcm = []
opus = ["dep:opus-decoder"]
# libopus-backed Opus decoding (FFI via the `opus` bindings crate), for
# integrators that already ship libopus (e.g. Chromium). When both `opus`
# and `opus-ffi` are enabled, DefaultFactory prefers the FFI decoder.
opus-ffi = ["dep:iamf-opus-ffi"]
flac = ["dep:symphonia-bundle-flac", "dep:symphonia-core"]
aac = ["dep:symphonia-codec-aac", "dep:symphonia-core"]

[dependencies]
# default-features = false so a trimmed embedder build (e.g. Chromium's
# pcm+opus-ffi shape) doesn't pull the binaural stack back in via feature
# unification; binaural is iamf-dec's concern, not this crate's.
iamf-dec = { path = "../iamf-dec", default-features = false }
iamf-obu = { path = "../iamf-obu" }
opus-decoder = { version = "0.1", optional = true }
iamf-opus-ffi = { path = "../opus-ffi", optional = true }
symphonia-core = { version = "0.5", optional = true, default-features = false }
symphonia-bundle-flac = { version = "0.5", optional = true }
symphonia-codec-aac = { version = "0.5", optional = true }

[lints]
workspace = true
